<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A bomb was YEETED at you | YEET BOMB</title>
<meta property="og:title" content="💣 A bomb was YEETED at you">
<meta property="og:description" content="Survive their traps or it blows up in your hands. Tap to open it in YEET BOMB.">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #12142a; color: #fff;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; }
  main { max-width: 420px; padding: 32px 22px; }
  h1 { font-size: 34px; margin: 8px 0; color: #ffd23f; letter-spacing: 1px; }
  .bomb { font-size: 84px; line-height: 1; }
  .code { font-size: 30px; font-weight: 800; letter-spacing: 3px; background: #1f2340; border: 3px dashed #ff4d5e; border-radius: 14px; padding: 12px; margin: 18px 0; }
  .btn { display: block; width: 100%; box-sizing: border-box; padding: 18px; margin: 12px 0; border: 0; border-radius: 16px; font-size: 20px; font-weight: 800;
         color: #fff; background: #ff4d5e; box-shadow: 0 6px 0 #b8283a; text-decoration: none; cursor: pointer; }
  .btn.alt { background: #3ee089; box-shadow: 0 6px 0 #1f9a59; color: #0b0c14; }
  p { color: #b9bdd8; line-height: 1.5; }
  small a { color: #8a90b0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="bomb">💣</div>
  <h1>A BOMB WAS YEETED AT YOU</h1>
  <p id="lead">Survive their traps or it blows up in your hands.</p>
  <div class="code" id="code">BOMB-??????</div>
  <button class="btn" id="open">OPEN IN YEET BOMB</button>
  <a class="btn alt" id="store" href="https://play.google.com/store/apps/details?id=com.driveiq.yeetbomb">GET YEET BOMB</a>
  <p id="note">Tapping copies the code. If you just installed the game, open it and the bomb will be waiting.</p>
  <p id="bad" class="hidden">This link has no valid bomb code. Ask your friend to send it again.</p>
  <small><a href="../">Privacy policy</a></small>
</main>
<script>
  // Codes use 2-9 and A-Z without I, L, O (same alphabet as the game).
  var raw = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/^BOMB-?/, "");
  var ok = /^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$/.test(raw);
  var pkg = "com.driveiq.yeetbomb";
  var store = "https://play.google.com/store/apps/details?id=" + pkg + (ok ? "&referrer=" + encodeURIComponent("bomb=" + raw) : "");
  document.getElementById("store").href = store;
  if (!ok) {
    document.getElementById("code").classList.add("hidden");
    document.getElementById("open").classList.add("hidden");
    document.getElementById("note").classList.add("hidden");
    document.getElementById("bad").classList.remove("hidden");
  } else {
    document.getElementById("code").textContent = "BOMB-" + raw;
  }

  function fallbackCopy(text) {
    var t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(t);
  }

  function copyCode() {
    var text = "BOMB-" + raw;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
    }
    fallbackCopy(text);
    return Promise.resolve();
  }

  // Copy first (the game reads the code from the clipboard), then open the app, or the store if it isn't installed.
  document.getElementById("open").addEventListener("click", function () {
    copyCode().then(function () {
      if (/android/i.test(navigator.userAgent)) {
        location.href = "intent://bomb/" + raw + "#Intent;scheme=yeetbomb;package=" + pkg +
          ";S.browser_fallback_url=" + encodeURIComponent(store) + ";end";
      } else {
        document.getElementById("note").textContent = "Code copied. YEET BOMB is on Android: get it, then tap OPEN in the game.";
      }
    });
  });
  document.getElementById("store").addEventListener("click", function () { if (ok) copyCode(); });
</script>
</body>
</html>

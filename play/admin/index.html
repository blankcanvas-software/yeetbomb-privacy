<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0f">
<title>Admin | YEET BOMB</title>
<link rel="icon" href="../../img/icon.png">
<link rel="stylesheet" href="../../site.css">
<style>
  .field { width: 100%; min-height: 52px; margin-top: 22px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--navy);
           color: var(--chrome-ink); box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.16); font: 18px var(--font-text); }
  .field:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .err { margin: 14px 0 0; color: var(--coral); font-weight: 700; }
</style>
</head>
<body class="invite">
<header class="bar">
  <a class="brand" href="../../"><img src="../../img/icon.png" alt="">YEET BOMB</a>
  <span class="by">Admin</span>
</header>
<main class="hero">
  <div class="inner">
    <p class="pill">Owner only</p>
    <h1 class="display">The full game</h1>
    <p class="lede" id="lede">Enter the password to play everything in this browser: Home, solo, party mode and the rest.</p>
    <form id="lock">
      <label class="hidden" for="pw">Password</label>
      <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <p class="err hidden" id="err">That's not it.</p>
      <div class="actions"><button class="btn btn--yellow btn--block" type="submit">Unlock</button></div>
    </form>
    <div class="actions hidden" id="open">
      <a class="btn btn--yellow btn--block" href="../">Play the full game</a>
      <button class="btn btn--ghost btn--block" id="relock" type="button">Lock this browser again</button>
    </div>
    <p class="note">The unlock stays in this browser until you lock it again or clear this site's data.</p>
  </div>
</main>
<script>
  // The game (/play/) unlocks itself when localStorage 'yb_admin' holds the key whose hash matches WEB_ADMIN_CHECK in
  // scripts/main.gd. Neither file contains the password: key = sha256("yeetbomb-admin:" + password),
  // check = sha256("yb-check:" + key). A browser-side lock: the server trusts it for nothing.
  var CHECK = "1b0d4c7f6b49dd588ab11d300bd14c1f3b15080e19a854d4f1b51ba65ef5402a";
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
  function sha256(text) { return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(hex); }
  function stored() { try { return localStorage.getItem("yb_admin") || ""; } catch (e) { return ""; } }
  function show(unlocked) {
    document.getElementById("lock").classList.toggle("hidden", unlocked);
    document.getElementById("open").classList.toggle("hidden", !unlocked);
    document.getElementById("lede").textContent = unlocked ? "This browser is unlocked." :
      "Enter the password to play everything in this browser: Home, solo, party mode and the rest.";
  }
  var key = stored();
  if (key) { sha256("yb-check:" + key).then(function (c) { show(c === CHECK); }); } else { show(false); }
  document.getElementById("lock").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = document.getElementById("pw").value;
    sha256("yeetbomb-admin:" + pw).then(function (k) {
      return sha256("yb-check:" + k).then(function (c) {
        if (c !== CHECK) { document.getElementById("err").classList.remove("hidden"); return; }
        try { localStorage.setItem("yb_admin", k); } catch (e) { document.getElementById("err").textContent = "This browser blocks site storage."; document.getElementById("err").classList.remove("hidden"); return; }
        location.href = "../";
      });
    });
  });
  document.getElementById("relock").addEventListener("click", function () {
    try { localStorage.removeItem("yb_admin"); } catch (e) {}
    show(false);
  });
</script>
</body>
</html>
